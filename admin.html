<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Arşiv Ekle</title>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; background: #0f0f0f; color: #fff; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #ffd700; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #ffd700; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
    button { background: #ffd700; color: #000; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; }
    #status { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; word-break: break-all; font-size: 14px; text-align: center; }
    .error { background: #500; color: #f88; }
    .success { background: #050; color: #8f8; }
    .info { background: #005; color: #88f; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="text-align:center; color:#ffd700;">Yeni Arşiv Ekle</h2>

  <div class="form-group">
    <label>GitHub Personal Access Token :</label>
    <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off">
  </div>

  <div class="form-group">
    <label>Doküman Başlığı (Titre) :</label>
    <input type="text" id="titleInput" placeholder="Ex: Sultan Vahidettin Belgesi">
  </div>

  <div class="form-group">
    <label>Kategori (Onglet) :</label>
    <select id="tabSelect" onchange="document.getElementById('newTabGroup').style.display = (this.value === '__NEW__') ? 'block' : 'none'">
      <option value="Sultan Vahidettin Gerçekleri">Sultan Vahidettin Gerçekleri</option>
      <option value="Kemalist Rejimi Gerçekleri">Kemalist Rejimi Gerçekleri</option>
      <option value="Sultan 2. Abdülhamid Gerçekleri">Sultan 2. Abdülhamid Gerçekleri</option>
      <option value="__NEW__">+ Yeni Kategori Oluştur...</option>
    </select>
  </div>

  <div class="form-group" id="newTabGroup" style="display: none;">
    <label>Yeni Kategori Adı :</label>
    <input type="text" id="newTabInput" placeholder="Ex: Osmanlı Arşivleri">
  </div>

  <div class="form-group">
    <label>Fotoğraf Seç :</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <button id="submitBtn" onclick="uploadArchive()">GitHub'a Gönder</button>

  <div id="status"></div>
</div>

<script>
  const USERNAME = "yclenes";
  const REPO = "Tarih";
  const JSON_PATH = "data.json";

  // Sauvegarde le token
  const tokenEl = document.getElementById('tokenInput');
  tokenEl.value = localStorage.getItem('my_gh_token') || '';
  tokenEl.addEventListener('change', () => localStorage.setItem('my_gh_token', tokenEl.value.trim()));

  function showStatus(msg, type) {
    const s = document.getElementById('status');
    s.style.display = 'block';
    s.className = type;
    s.innerText = msg;
  }

  // Convertit l'image en base64 de manière simple
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const result = reader.result.split(',')[1];
        resolve(result);
      };
      reader.onerror = (e) => reject(e);
      reader.readAsDataURL(file);
    });
  }

  async function uploadArchive() {
    const token = tokenEl.value.trim();
    const title = document.getElementById('titleInput').value.trim();
    const selectVal = document.getElementById('tabSelect').value;
    const newTab = document.getElementById('newTabInput').value.trim();
    const fileInput = document.getElementById('imageInput');
    const file = fileInput.files[0];

    const onglet = (selectVal === '__NEW__') ? newTab : selectVal;

    // Vérifications de base
    if (!token) { showStatus("Lütfen GitHub Token giriniz!", "error"); return; }
    if (!title) { showStatus("Lütfen bir başlık giriniz!", "error"); return; }
    if (!onglet) { showStatus("Lütfen bir kategori seçiniz!", "error"); return; }
    if (!file) { showStatus("Lütfen bir fotoğraf seçiniz!", "error"); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      showStatus("1/3 Fotoğraf okunuyor...", "info");
      const base64Image = await fileToBase64(file);

      // 1. Upload de l'image dans images/
      showStatus("2/3 Fotoğraf GitHub'a yükleniyor...", "info");
      const ext = file.name.split('.').pop() || 'jpg';
      const imagePath = `images/${Date.now()}.${ext}`;
      
      const imgRes = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/${imagePath}`, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Fotoğraf: ${title}`,
          content: base64Image
        })
      });

      if (!imgRes.ok) {
        const err = await imgRes.json();
        throw new Error("Görsel yüklenemedi: " + (err.message || imgRes.status));
      }

      // 2. Récupération et mise à jour de data.json
      showStatus("3/3 data.json güncelleniyor...", "info");
      const jsonUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${JSON_PATH}`;
      
      const getJson = await fetch(jsonUrl, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      let currentData = [];
      let sha = "";

      if (getJson.ok) {
        const jsonInfo = await getJson.json();
        sha = jsonInfo.sha;
        // Décodage UTF-8 simple
        const contentClean = jsonInfo.content.replace(/\s/g, '');
        const decodedText = decodeURIComponent(escape(atob(contentClean)));
        currentData = JSON.parse(decodedText);
      }

      currentData.push({
        id: Date.now(),
        titre: title,
        image: imagePath,
        onglet: onglet
      });

      const updatedText = JSON.stringify(currentData, null, 2);
      const updatedBase64 = btoa(unescape(encodeURIComponent(updatedText)));

      const putJson = await fetch(jsonUrl, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Arşiv eklendi: ${title}`,
          content: updatedBase64,
          sha: sha || undefined
        })
      });

      if (putJson.ok) {
        showStatus(" Başarıyla yüklendi!", "success");
        document.getElementById('titleInput').value = '';
        fileInput.value = '';
      } else {
        const err = await putJson.json();
        throw new Error("JSON hatası: " + err.message);
      }

    } catch (err) {
      showStatus("Hata: " + err.message, "error");
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
