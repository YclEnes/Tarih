<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Arşiv Ekle</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 500px; margin: 15px auto; padding: 15px; background: #0f0f0f; color: #fff; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 12px; border: 1px solid #ffd700; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #ffd700; font-size: 0.95rem; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; box-sizing: border-box; }
    input:focus, select:focus { border-color: #ffd700; outline: none; }
    button { background: #ffd700; color: #000; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; padding: 14px; font-size: 1rem; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; word-break: break-all; font-size: 14px; text-align: center; }
    .error { background: rgba(220, 53, 69, 0.3); color: #ff8888; border: 1px solid #dc3545; }
    .success { background: rgba(40, 167, 69, 0.3); color: #88ff88; border: 1px solid #28a745; }
    .info { background: rgba(0, 123, 255, 0.3); color: #8888ff; border: 1px solid #17a2b8; }
  </style>
</head>
<body>

<div class="card">
  <h2 style="text-align:center; color:#ffd700; margin-top:0;">Yeni Arşiv Ekle</h2>

  <div class="form-group">
    <label>GitHub Personal Access Token :</label>
    <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off">
  </div>

  <div class="form-group">
    <label>Doküman Başlığı (Titre) :</label>
    <input type="text" id="titleInput" placeholder="Ex: Sultan Vahidettin Belgesi">
  </div>

  <div class="form-group">
    <label>Kategori (Onglet) :</label>
    <select id="tabSelect" onchange="toggleNewTab(this.value)">
      <option value="Sultan Vahidettin Gerçekleri">Sultan Vahidettin Gerçekleri</option>
      <option value="Kemalist Rejimi Gerçekleri">Kemalist Rejimi Gerçekleri</option>
      <option value="Sultan 2. Abdülhamid Gerçekleri">Sultan 2. Abdülhamid Gerçekleri</option>
      <option value="__NEW__">+ Yeni Kategori Oluştur...</option>
    </select>
  </div>

  <div class="form-group" id="newTabGroup" style="display: none;">
    <label>Yeni Kategori Adı :</label>
    <input type="text" id="newTabInput" placeholder="Ex: Osmanlı Arşivleri">
  </div>

  <div class="form-group">
    <label>Fotoğraf Seç :</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <button type="button" id="submitBtn" onclick="uploadArchive()">GitHub'a Gönder</button>

  <div id="status"></div>
</div>

<script>
  const USERNAME = "yclenes";
  const REPO = "Tarih";
  const JSON_PATH = "data.json";

  const tokenInput = document.getElementById('tokenInput');
  try {
    tokenInput.value = localStorage.getItem('my_gh_token') || '';
    tokenInput.addEventListener('input', () => {
      try { localStorage.setItem('my_gh_token', tokenInput.value.trim()); } catch(e){}
    });
  } catch(e) {}

  function toggleNewTab(val) {
    document.getElementById('newTabGroup').style.display = (val === '__NEW__') ? 'block' : 'none';
  }

  function showStatus(msg, type) {
    const s = document.getElementById('status');
    s.style.display = 'block';
    s.className = type;
    s.innerText = msg;
  }

  // Fonctions UTF-8 universelles compatibles iOS et PC
  function stringToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return window.btoa(binary);
  }

  function base64ToString(b64) {
    const binary = window.atob(b64.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  // Compression légère de l'image pour un stockage propre dans data.json
  function compressImageToBase64(file, maxDimension = 1200) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Renvoie directement le dataURL complet (data:image/jpeg;base64,...)
          resolve(canvas.toDataURL('image/jpeg', 0.75));
        };
        img.onerror = () => reject(new Error("Görsel işlenemedi"));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("Dosya okunamadı"));
      reader.readAsDataURL(file);
    });
  }

  async function uploadArchive() {
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    try {
      const token = tokenInput.value.trim();
      const title = document.getElementById('titleInput').value.trim();
      const selectVal = document.getElementById('tabSelect').value;
      const newTab = document.getElementById('newTabInput').value.trim();
      const fileEl = document.getElementById('imageInput');
      const file = (fileEl.files && fileEl.files.length > 0) ? fileEl.files[0] : null;

      const onglet = (selectVal === '__NEW__') ? newTab : selectVal;

      if (!token) { showStatus("Token giriniz!", "error"); btn.disabled = false; return; }
      if (!title) { showStatus("Başlık giriniz!", "error"); btn.disabled = false; return; }
      if (!onglet) { showStatus("Kategori seçiniz!", "error"); btn.disabled = false; return; }
      if (!file) { showStatus("Fotoğraf seçiniz!", "error"); btn.disabled = false; return; }

      showStatus("Fotoğraf işleniyor ve sıkıştırılıyor...", "info");
      const base64DataUrl = await compressImageToBase64(file);

      showStatus("GitHub'a bağlanılıyor...", "info");
      const jsonUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${JSON_PATH}`;

      const getJson = await fetch(jsonUrl, {
        headers: { "Authorization": `Bearer ${token}` }
      });

      let currentData = [];
      let sha = "";

      if (getJson.ok) {
        const jsonInfo = await getJson.json();
        sha = jsonInfo.sha;
        const textContent = base64ToString(jsonInfo.content);
        if (textContent.trim().length > 0) {
          currentData = JSON.parse(textContent);
        }
      }

      // Ajout de l'objet avec l'image en Base64 brute
      currentData.push({
        id: Date.now(),
        titre: title,
        image: base64DataUrl,
        onglet: onglet
      });

      showStatus("data.json güncelleniyor...", "info");

      const updatedText = JSON.stringify(currentData, null, 2);
      const updatedBase64 = stringToBase64(updatedText);

      const putJson = await fetch(jsonUrl, {
        method: "PUT",
        headers: {
          "Authorization": `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: `Yeni arşiv eklendi: ${title}`,
          content: updatedBase64,
          sha: sha || undefined
        })
      });

      if (putJson.ok) {
        showStatus(" Başarıyla yüklendi!", "success");
        document.getElementById('titleInput').value = '';
        fileEl.value = '';
      } else {
        const err = await putJson.json();
        throw new Error("GitHub Hata: " + err.message);
      }

    } catch (err) {
      showStatus("Hata: " + (err.message || err), "error");
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
