<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Arşiv Ekle</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background: #0f0f0f; color: #e0e0e0; }
    .card { background: #1a1a1a; padding: 25px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255, 215, 0, 0.2); }
    h2 { color: #ffd700; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #d4d4d4; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,215,0,0.2); background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 1rem; }
    input:focus, select:focus { border-color: #ffd700; outline: none; }
    button { background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
    button:active { transform: scale(0.98); }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-weight: bold; word-break: break-word; text-align: center; }
    .success { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745; }
    .error { background: rgba(220, 53, 69, 0.2); color: #dc3545; border: 1px solid #dc3545; }
    .info { background: rgba(0, 123, 255, 0.2); color: #17a2b8; border: 1px solid #17a2b8; }
  </style>
</head>
<body>

<div class="card">
  <h2>Yeni Arşiv Ekle</h2>

  <div class="form-group">
    <label>GitHub Personal Access Token :</label>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx">
  </div>

  <div class="form-group">
    <label>Doküman Başlığı (Titre) :</label>
    <input type="text" id="titleInput" placeholder="Ex: Sultan Vahidettin Belgesi">
  </div>

  <div class="form-group">
    <label>Kategori Seç (Onglet) :</label>
    <select id="tabSelect" onchange="toggleNewTabInput(this.value)">
      <!-- Les 3 onglets par défaut du site -->
      <option value="Sultan Vahidettin Gerçekleri">Sultan Vahidettin Gerçekleri</option>
      <option value="Kemalist Rejimi Gerçekleri">Kemalist Rejimi Gerçekleri</option>
      <option value="Sultan 2. Abdülhamid Gerçekleri">Sultan 2. Abdülhamid Gerçekleri</option>
      <option value="__NEW__">+ Yeni Kategori Oluştur... (Créer nouvel onglet)</option>
    </select>
  </div>

  <div class="form-group" id="newTabGroup" style="display: none;">
    <label>Yeni Kategori Adı (Nom du nouvel onglet) :</label>
    <input type="text" id="newTabInput" placeholder="Ex: Osmanlı Arşivleri">
  </div>

  <div class="form-group">
    <label>Fotoğraf Seç (Image / Screenshot) :</label>
    <!-- accept="image/*" permet de capturer n'importe quel format (PNG, JPG, Screenshots, etc.) -->
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <button id="submitBtn" onclick="uploadArchive()">GitHub'a Gönder (Publier)</button>

  <div id="status"></div>
</div>

<script>
  const USERNAME = "yclenes";
  const REPO = "Tarih";
  const JSON_PATH = "data.json";

  // Sauvegarde automatique du Token dans le navigateur
  document.getElementById('tokenInput').value = localStorage.getItem('my_gh_token') || '';
  document.getElementById('tokenInput').addEventListener('input', (e) => {
    localStorage.setItem('my_gh_token', e.target.value.trim());
  });

  // UTF-8 sécurisé
  function utf8_to_b64(str) {
    return window.btoa(unescape(encodeURIComponent(str)));
  }

  function b64_to_utf8(str) {
    return decodeURIComponent(escape(window.atob(str)));
  }

  // Charger d'éventuels onglets personnalisés créés précédemment
  async function loadExistingTabs() {
    try {
      const res = await fetch(`https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${JSON_PATH}?t=${Date.now()}`);
      if (!res.ok) return;

      const data = await res.json();
      if (!Array.isArray(data)) return;
      
      const defaultTabs = [
        "Sultan Vahidettin Gerçekleri",
        "Kemalist Rejimi Gerçekleri",
        "Sultan 2. Abdülhamid Gerçekleri"
      ];

      const customTabs = [...new Set(data.map(item => item.onglet).filter(o => o && !defaultTabs.includes(o)))];
      const select = document.getElementById('tabSelect');

      // Ajouter les onglets créés plus tard
      customTabs.forEach(tab => {
        const opt = document.createElement('option');
        opt.value = tab;
        opt.innerText = tab;
        select.insertBefore(opt, select.querySelector('option[value="__NEW__"]'));
      });
    } catch (e) {
      console.log("Aucun onglet supplémentaire trouvé.");
    }
  }

  function toggleNewTabInput(value) {
    document.getElementById('newTabGroup').style.display = (value === '__NEW__') ? 'block' : 'none';
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  async function uploadArchive() {
    const token = document.getElementById('tokenInput').value.trim();
    const title = document.getElementById('titleInput').value.trim();
    const selectValue = document.getElementById('tabSelect').value;
    const newTab = document.getElementById('newTabInput').value.trim();
    const imageFile = document.getElementById('imageInput').files[0];
    const submitBtn = document.getElementById('submitBtn');

    const onglet = (selectValue === '__NEW__') ? newTab : selectValue;

    if (!token) {
      showStatus("Lütfen GitHub Tokeninizi girin! (Token manquant)", "error");
      return;
    }

    if (!title || !onglet || !imageFile) {
      showStatus("Lütfen tüm alanları doldurun! (Veuillez tout remplir)", "error");
      return;
    }

    submitBtn.disabled = true;
    showStatus("Fotoğraf işleniyor ve GitHub'a yükleniyor...", "info");

    try {
      // Conversion n'importe quel format (Screenshots y compris) en Base64
      const imageBase64 = await fileToBase64(imageFile);

      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${JSON_PATH}`;
      
      const getRes = await fetch(apiUrl, {
        headers: { "Authorization": `token ${token}` }
      });

      let currentData = [];
      let sha = "";

      if (getRes.status === 200) {
        const fileInfo = await getRes.json();
        sha = fileInfo.sha;
        const decodedContent = b64_to_utf8(fileInfo.content.replace(/\n/g, ''));
        currentData = JSON.parse(decodedContent);
      } else if (getRes.status === 401) {
        throw new Error("Bad credentials: Token geçersiz.");
      }

      const newItem = {
        id: Date.now(),
        titre: title,
        image: imageBase64,
        onglet: onglet
      };

      currentData.push(newItem);

      const updatedContentBase64 = utf8_to_b64(JSON.stringify(currentData, null, 2));

      const putBody = {
        message: `Yeni arşiv eklendi: ${title}`,
        content: updatedContentBase64
      };
      
      if (sha) putBody.sha = sha;

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(putBody)
      });

      if (putRes.ok) {
        showStatus(" Başarıyla yüklendi! (Ajouté avec succès !)", "success");
        document.getElementById('titleInput').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('newTabInput').value = '';
        loadExistingTabs();
      } else {
        const errorData = await putRes.json();
        showStatus("GitHub Hata: " + (errorData.message || "Erreur"), "error");
      }

    } catch (err) {
      showStatus("Hata : " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  }

  function showStatus(msg, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.innerText = msg;
  }

  window.addEventListener('DOMContentLoaded', loadExistingTabs);
</script>

</body>
</html>
