<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Arşiv Ekle</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 600px; margin: 15px auto; padding: 15px; background: #0f0f0f; color: #e0e0e0; }
    .card { background: #1a1a1a; padding: 20px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); border: 1px solid rgba(255, 215, 0, 0.2); }
    h2 { color: #ffd700; margin-bottom: 20px; text-align: center; font-size: 1.4rem; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #d4d4d4; font-size: 0.95rem; }
    input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,215,0,0.2); background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 1rem; -webkit-appearance: none; }
    input:focus, select:focus { border-color: #ffd700; outline: none; }
    button { background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; padding: 14px; font-size: 1.05rem; }
    button:disabled { background: #555; color: #888; cursor: not-allowed; }
    #status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; font-weight: bold; word-break: break-word; text-align: center; font-size: 0.95rem; }
    .success { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745; }
    .error { background: rgba(220, 53, 69, 0.2); color: #dc3545; border: 1px solid #dc3545; }
    .info { background: rgba(0, 123, 255, 0.2); color: #17a2b8; border: 1px solid #17a2b8; }
  </style>
</head>
<body>

<div class="card">
  <h2>Yeni Arşiv Ekle (iOS Fix)</h2>

  <div class="form-group">
    <label>GitHub Personal Access Token :</label>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" autocapitalize="off">
  </div>

  <div class="form-group">
    <label>Doküman Başlığı (Titre) :</label>
    <input type="text" id="titleInput" placeholder="Ex: Sultan Vahidettin Belgesi">
  </div>

  <div class="form-group">
    <label>Kategori Seç (Onglet) :</label>
    <select id="tabSelect" onchange="toggleNewTabInput(this.value)">
      <option value="Sultan Vahidettin Gerçekleri">Sultan Vahidettin Gerçekleri</option>
      <option value="Kemalist Rejimi Gerçekleri">Kemalist Rejimi Gerçekleri</option>
      <option value="Sultan 2. Abdülhamid Gerçekleri">Sultan 2. Abdülhamid Gerçekleri</option>
      <option value="__NEW__">+ Yeni Kategori Oluştur...</option>
    </select>
  </div>

  <div class="form-group" id="newTabGroup" style="display: none;">
    <label>Yeni Kategori Adı :</label>
    <input type="text" id="newTabInput" placeholder="Ex: Osmanlı Arşivleri">
  </div>

  <div class="form-group">
    <label>Fotoğraf Seç (Photo / Ekran Görüntüsü) :</label>
    <input type="file" id="imageInput" accept="image/*">
  </div>

  <button id="submitBtn" onclick="uploadArchive()">GitHub'a Gönder</button>

  <div id="status"></div>
</div>

<script>
  const USERNAME = "yclenes";
  const REPO = "Tarih";
  const JSON_PATH = "data.json";

  document.getElementById('tokenInput').value = localStorage.getItem('my_gh_token') || '';
  document.getElementById('tokenInput').addEventListener('input', (e) => {
    localStorage.setItem('my_gh_token', e.target.value.trim());
  });

  function stringToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    const len = bytes.byteLength;
    for (let i = 0; i < len; i++) {
      binary += String.fromCharCode(bytes[i]);
    }
    return window.btoa(binary);
  }

  function base64ToString(b64) {
    const binary = window.atob(b64.replace(/\s/g, ''));
    const len = binary.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder().decode(bytes);
  }

  function toggleNewTabInput(value) {
    document.getElementById('newTabGroup').style.display = (value === '__NEW__') ? 'block' : 'none';
  }

  // OPTIMISATION SPECIALE IPHONE : Compresse et redimensionne l'image via un Canvas HTML5
  function compressImageIOS(file, maxWidth = 1600, quality = 0.8) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // Convertit en base64 léger au format JPEG
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        };
        img.onerror = (err) => reject(new Error("Görsel yüklenemedi (Erreur image)"));
        img.src = event.target.result;
      };
      reader.onerror = (err) => reject(new Error("Dosya okunamadı (Erreur lecture fichier)"));
      reader.readAsDataURL(file);
    });
  }

  async function uploadArchive() {
    const token = document.getElementById('tokenInput').value.trim();
    const title = document.getElementById('titleInput').value.trim();
    const selectValue = document.getElementById('tabSelect').value;
    const newTab = document.getElementById('newTabInput').value.trim();
    const imageFile = document.getElementById('imageInput').files[0];
    const submitBtn = document.getElementById('submitBtn');

    const onglet = (selectValue === '__NEW__') ? newTab : selectValue;

    if (!token) {
      showStatus("Lütfen GitHub Tokeninizi girin!", "error");
      return;
    }

    if (!title || !onglet || !imageFile) {
      showStatus("Lütfen tüm alanları doldurun!", "error");
      return;
    }

    submitBtn.disabled = true;
    showStatus("Fotoğraf iOS için optimize ediliyor...", "info");

    try {
      // 1. Compression optimisée iPhone
      const imageBase64 = await compressImageIOS(imageFile);

      showStatus("GitHub'a bağlanılıyor...", "info");

      const apiUrl = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${JSON_PATH}`;

      const getRes = await fetch(apiUrl, {
        headers: { 
          "Authorization": `token ${token}`,
          "Accept": "application/vnd.github.v3+json"
        }
      });

      let currentData = [];
      let sha = "";

      if (getRes.status === 200) {
        const fileInfo = await getRes.json();
        sha = fileInfo.sha;
        const decodedContent = base64ToString(fileInfo.content);
        currentData = JSON.parse(decodedContent);
      } else if (getRes.status === 401) {
        throw new Error("Token hatalı veya süresi dolmuş (Bad credentials)");
      } else if (getRes.status !== 404) {
        throw new Error(`GitHub HTTP Hata: ${getRes.status}`);
      }

      const newItem = {
        id: Date.now(),
        titre: title,
        image: imageBase64,
        onglet: onglet
      };

      currentData.push(newItem);

      showStatus("Veriler GitHub'a yükleniyor...", "info");

      const updatedContentBase64 = stringToBase64(JSON.stringify(currentData, null, 2));

      const putBody = {
        message: `Yeni arşiv eklendi (iOS): ${title}`,
        content: updatedContentBase64
      };
      
      if (sha) putBody.sha = sha;

      const putRes = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify(putBody)
      });

      if (putRes.ok) {
        showStatus(" Başarıyla yüklendi! (Succès sur iPhone !)", "success");
        document.getElementById('titleInput').value = '';
        document.getElementById('imageInput').value = '';
        document.getElementById('newTabInput').value = '';
      } else {
        const errorData = await putRes.json();
        showStatus("GitHub Hata: " + (errorData.message || "Bilinmeyen hata"), "error");
      }

    } catch (err) {
      showStatus("Hata: " + err.message, "error");
    } finally {
      submitBtn.disabled = false;
    }
  }

  function showStatus(msg, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = 'block';
    statusDiv.className = type;
    statusDiv.innerText = msg;
  }
</script>

</body>
</html>
